<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.55" stop-color="#121A3A"/>
      <stop offset="1" stop-color="#1E1445"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.15" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.9" cy="0.88" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#glowV)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- logo badge -->
  <rect x="90" y="100" width="96" height="96" rx="24" fill="url(#brand)"/>
  <text x="138" y="169" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF">V</text>

  <!-- eyebrow -->
  <text x="210" y="142" font-family="'DejaVu Sans', sans-serif" font-size="24" letter-spacing="4" fill="#7C9CFF">DOCUMENTATION ENGINE</text>
  <text x="210" y="174" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#8E9BBD">TypeScript-first project intelligence</text>

  <!-- title -->
  <text x="90" y="312" font-family="'DejaVu Sans', sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">@vetwo<tspan fill="url(#brand)">/docs</tspan></text>

  <!-- tagline -->
  <text x="90" y="368" font-family="'DejaVu Sans', sans-serif" font-size="30" fill="#AEB9D6">The easiest and most powerful</text>
  <text x="90" y="408" font-family="'DejaVu Sans', sans-serif" font-size="30" fill="#AEB9D6">documentation generator for JS and TS</text>

  <!-- accent bar -->
  <rect x="90" y="432" width="140" height="6" rx="3" fill="url(#brand)"/>

  <!-- pills -->
  <g font-family="'DejaVu Sans', sans-serif" font-size="24" fill="#DCE4FF" text-anchor="middle">
    <rect x="90" y="460" width="190" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="185" y="494">TypeScript</text>
    <rect x="296" y="460" width="130" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="361" y="494">MDX</text>
    <rect x="442" y="460" width="180" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="532" y="494">Fumadocs</text>
  </g>

  <!-- terminal card -->
  <rect x="800" y="130" width="340" height="370" rx="20" fill="#0B1130" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="832" cy="166" r="7" fill="#F87171"/>
  <circle cx="856" cy="166" r="7" fill="#FBBF24"/>
  <circle cx="880" cy="166" r="7" fill="#34D399"/>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="23">
    <text x="828" y="222" fill="#34D399">$<tspan fill="#FFFFFF"> npx docs generate</tspan></text>
    <text x="828" y="272" fill="#34D399">✓<tspan fill="#AEB9D6"> 71 pages · md</tspan></text>
    <text x="828" y="312" fill="#34D399">✓<tspan fill="#AEB9D6"> search-index.json</tspan></text>
    <text x="828" y="352" fill="#34D399">✓<tspan fill="#AEB9D6"> manifest.json</tspan></text>
    <text x="828" y="392" fill="#34D399">✓<tspan fill="#AEB9D6"> 0 errors</tspan></text>
    <text x="828" y="448" fill="#5B6B8C"># intelligence → IR → markdown</text>
  </g>
  <rect x="800" y="484" width="340" height="16" fill="url(#brand)" opacity="0.85"/>
</svg>
